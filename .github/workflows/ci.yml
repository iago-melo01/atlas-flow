name: atlasflow ci pipeline 

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs: 
  tests-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atlas_flow_test
          POSTGRES_USER: user
          POSTGRES_PASSWORD: user
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d atlas_flow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Clona o repositório
        uses: actions/checkout@v4
      - name: Instalar PHP 8.4 
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, bcmath, zip
          coverage: none
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist
      - name: Preparar o ambiente (envs)
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Verificar sintaxe PHP
        run: find . -name "*.php" -not -path "./vendor/*" -not -path "./storage/*" -not -path "./bootstrap/cache/*" -print0 | xargs -0 -n1 sh -c 'php -l "$0" || exit 1'
      - name: Executa testes php 
        run: php artisan test
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Clona o repositório
        uses: actions/checkout@v4
      
      - name: Análise estática com Semgrep
        run: >
          semgrep scan
          --config p/php
          --config p/secrets
          --config p/dockerfile
          --config p/docker-compose
          --severity ERROR
          --error
          --sarif-output semgrep.sarif
        
      - name: Publicar relatório do Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: tests-backend
    steps:
      - name: Clona o repositório
        uses: actions/checkout@v4

      - name: Criar .env com APP_KEY
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" > backend/.env

      - name: Subir aplicação com Docker Compose
        run: docker compose up -d --build db backend

      - name: Aguardar aplicação ficar pronta
        run: curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://localhost:8000/up
      
      - name: Popular banco com usuários de testes
        run: docker compose exec -T backend php artisan db:seed --force

      - name: Autenticar usuário de teste para o ZAP
        run: |
          BASE=http://localhost:8000
          FRONT=http://localhost:5173
          JAR=cookies.txt

          #1 Pede o cookie Xsrf token
          curl -fsS -c $JAR -b $JAR -H "Referer: $FRONT/" $BASE/sanctum/csrf-cookie

          #O valor do cookie vem codificado em url, o header precisa dele decodificado
          read_xsrf() {
            awk '$6=="XSRF-TOKEN"{print $7}' $JAR | python3 -c 'import sys,urllib.parse;print(urllib.parse.unquote(sys.stdin.read().strip()))'
          }

          #2 Faz o login com o usuário do UserSeeder
          curl -fsS -c $JAR -b $JAR -X POST $BASE/login \
            -H "Accept: application/json" -H "Content-Type: application/json" \
            -H "Referer: $FRONT/" -H "X-XSRF-TOKEN: $(read_xsrf)" \
            -d '{"email":"atlas@example.com","password":"password"}'

          #3 O Login gera um token CSRF novo, então lê de novo
          XSRF=$(read_xsrf)
          COOKIE=$(awk '{sub(/^#HttpOnly_/,"")} !/^#/ && NF==7 {printf "%s%s=%s", sep, $6, $7; sep="; "}' $JAR)

          #4 Testa se a sessão está funcionando. se der erro vai retornar 401
          curl -fsS -o /dev/null -w "Rota protegida respondeu %{http_code}\n" \
            -H "Cookie: $COOKIE" -H "Referer: $FRONT/" -H "Accept: application/json" \
            $BASE/api/habit/list

             # 5. Entrega os valores para o step do ZAP
          echo "ZAP_AUTH_HEADER=Cookie" >> $GITHUB_ENV
          echo "ZAP_AUTH_HEADER_VALUE=$COOKIE" >> $GITHUB_ENV
          echo "ZAP_AUTH_HEADER_SITE=localhost" >> $GITHUB_ENV
          echo "ZAP_XSRF=$XSRF" >> $GITHUB_ENV
      
      - name: Scan dinâmico com OWASP ZAP
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: http://localhost:8000/docs/api.json
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-report
          cmd_options: >-
            -z "-config replacer.full_list(0).description=referer
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstr=Referer
            -config replacer.full_list(0).regex=false
            -config replacer.full_list(0).replacement=http://localhost:5173/
            -config replacer.full_list(1).description=xsrf
            -config replacer.full_list(1).enabled=true
            -config replacer.full_list(1).matchtype=REQ_HEADER
            -config replacer.full_list(1).matchstr=X-XSRF-TOKEN
            -config replacer.full_list(1).regex=false
            -config replacer.full_list(1).replacement=${{ env.ZAP_XSRF }}"

      - name: Validar alertas de risco alto
        run: |
          HIGH=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' report_json.json)
          echo "Alertas de risco alto: $HIGH"
          jq -r '.site[].alerts[] | select(.riskcode == "3") | "- \(.name)"' report_json.json
          if [ "$HIGH" -gt 0 ]; then
            echo "Pipeline bloqueado: vulnerabilidades de risco alto encontradas pelo ZAP."
            exit 1
          fi

      - name: Logs do backend em caso de falha
        if: failure()
        run: docker compose logs backend
