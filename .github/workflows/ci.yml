name: atlasflow ci pipeline 

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
jobs: 
  tests-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Clona o repositório
        uses: actions/checkout@v4
      - name: Instalar PHP 8.4 
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, bcmath, zip
          coverage: none
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist
      - name: Preparar o ambiente (envs)
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Verificar sintaxe PHP
        run: find . -name "*.php" -not -path "./vendor/*" -not -path "./storage/*" -not -path "./bootstrap/cache/*" -print0 | xargs -0 -n1 sh -c 'php -l "$0" || exit 1'
      - name: Executa testes php 
        run: php artisan test
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Clona o repositório
        uses: actions/checkout@v4
      
      - name: Análise estática com Semgrep
        run: >
          semgrep scan
          --config p/php
          --config p/secrets
          --config p/dockerfile
          --config p/docker-compose
          --severity ERROR
          --error
          --sarif-output semgrep.sarif
        
      - name: Publicar relatório do Semgrep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep.sarif
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: tests-backend
    steps:
      - name: Clona o repositório
        uses: actions/checkout@v4

      - name: Criar .env com APP_KEY
        run: echo "APP_KEY=base64:$(openssl rand -base64 32)" > backend/.env

      - name: Subir aplicação com Docker Compose
        run: docker compose up -d --build db backend

      - name: Aguardar aplicação ficar pronta
        run: curl --retry 30 --retry-delay 2 --retry-all-errors -fsS http://localhost:8000/up
      
      - name: Scan dinâmico com OWASP ZAP
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: http://localhost:8000
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-report

      - name: Validar alertas de risco alto
        run: |
          HIGH=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' report_json.json)
          echo "Alertas de risco alto: $HIGH"
          jq -r '.site[].alerts[] | select(.riskcode == "3") | "- \(.name)"' report_json.json
          if [ "$HIGH" -gt 0 ]; then
            echo "Pipeline bloqueado: vulnerabilidades de risco alto encontradas pelo ZAP."
            exit 1
          fi

      - name: Logs do backend em caso de falha
        if: failure()
        run: docker compose logs backend
